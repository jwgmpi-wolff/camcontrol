[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera_bridge"
version = "0.1.0"
description = "Self-hosted multi-camera gateway: capture, snapshot, and storage-provider routing."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "paramiko>=3.4",
    "boto3>=1.34",
    "httpx>=0.27",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
