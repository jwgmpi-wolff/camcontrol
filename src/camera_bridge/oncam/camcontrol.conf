# CamControl on-camera configuration.
# Rewritten by the config portal and by the gateway installer. Values take
# effect on the next reboot (camcontrol-boot.sh -> camcontrol-apply.sh).
#
# Keep this file at mode 0600: it holds the wifi PSK, the admin password and
# the gateway API key.

# SSH (dropbear) listening port.
ssh_port=22

# Wifi client: the network the camera joins during normal operation.
wifi_ssid=
wifi_psk=

# Interface override. Blank = autodetect (wlan0, wlan1, ra0, apcli0).
wifi_interface=

# How long to wait at boot for wifi to associate before considering the setup
# AP. Only applies when wifi_ssid is set.
wifi_wait_seconds=120

# Camera login account applied to the system user below.
admin_user=root
admin_password=

# Gateway the camera announces itself to on boot. Blank disables announcing.
api_endpoint=
api_key=
camera_id=
# Seconds between outbound preview uploads to the Azure gateway. Zero disables
# push mode. The gateway decodes the camera's /tmp/view H.264 buffer.
push_interval_seconds=5

# Configuration access point. Raised when the camera cannot join wifi_ssid,
# or always when ap_always=1. ap_psk must be 8..63 chars (WPA2 requirement);
# the installer generates one when it is left blank.
ap_always=0
ap_ssid=
ap_psk=
ap_address=192.168.8.1
ap_channel=6

# How long the AP stays up before the camera reboots back into client mode.
# 0 keeps it up indefinitely.
ap_timeout_seconds=900

# Port the configuration portal listens on while the AP is up.
portal_port=8080
