# Firmware selection for this specific camera unit.
#
# Camera   : YI Outdoor Camera 1080p, model YHS.3017, FCC ID 2AFIB-YHS3017
# Chipset  : HiSilicon Hi3518e V200 (confirmed via stock firmware version scheme
#            3.0.0.0x_YYYYMMDDHHMM, which only exists in this project's table --
#            it does NOT overlap with roleoroleo/yi-hack-Allwinner-v2's scheme
#            of 9.0.26x / 11.1.26x, so that firmware must NEVER be flashed here)
# Stock FW : 3.0.0.0D_201809111054 (OTA-offered: 3.0.0.0A_202607281057)
# MAC OUI  : 50:13:95 (Sichuan AI-Link Technology -- WiFi module, not decisive
#            for chipset family; kept here only as an identity cross-check)

[source]
project  = shadow-1/yi-hack-v3
release  = 0.1.6
url      = https://github.com/shadow-1/yi-hack-v3/releases/tag/0.1.6

[files]
# Filenames are fixed by the firmware loader -- do not rename.
rootfs_h30.name   = rootfs_h30
rootfs_h30.size   = 962416
rootfs_h30.sha256 = 07BD22B4DCAB90C40AEEA0DEFD5DFEADAFE206317A77CB2A799F026122B68E12

home_h30.name     = home_h30
home_h30.size     = 8608472
home_h30.sha256   = 3E76577F528BBA0A8FB32A4DCF86A614EF9E732FCE21D9418A31EEC228202181

[sd_card]
filesystem = FAT32   # exFAT will not be recognized by the loader
layout     = flat    # rootfs_h30 and home_h30 belong at the SD card root, no subfolders

[default_credentials]
ssh    = root / (blank), port 22
telnet = root / (blank), port 23 (disabled by default)
ftp    = root / (blank), port 21

[known_limitations]
# This firmware family (yi-hack-v3) is an older, more minimal hack than
# roleoroleo/yi-hack-Allwinner-v2. Its documented feature set is limited to:
# SSH, Telnet (off by default), FTP, a local web config UI, and proxychains-ng
# for region-lock bypass. It does not document a built-in RTSP/ONVIF
# restreamer. Do not assume rtsp://<ip>/ch0_0.264 will work after flashing --
# verify by checking the web UI "About" page and probing common paths, or
# fall back to pulling recordings over FTP/SFTP instead of live RTSP.
