name: Build Releases (Windows EXE + Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: camcontrol
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        working-directory: camcontrol
        run: pyinstaller CamControl.spec --distpath dist --workpath build_tmp --noconfirm
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamControl-Windows-EXE
          path: camcontrol/dist/CamControl.exe
      - name: Create/update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CamControl — Latest Build
          files: camcontrol/dist/CamControl.exe
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        working-directory: camcontrol/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamControl-Android-APK
          path: camcontrol/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CamControl — Latest Build
          files: camcontrol/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

