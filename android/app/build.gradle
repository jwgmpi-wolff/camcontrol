plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wolff.camcontrol'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wolff.camcontrol'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false }
    }
}

dependencies {}
